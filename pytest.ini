[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
asyncio_mode = auto
markers =
    unit: Unit tests (fast, no external deps)
    integration: Integration tests (may use mocks)
    slow: Tests that take >5 seconds

