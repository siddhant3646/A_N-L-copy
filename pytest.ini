[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Coverage and HTML reports are opt-in to keep the default run fast:
#   pytest --cov=src --cov-report=html:htmlcov --cov-report=xml
# Measured: plain "pytest" (~5 min) beats "pytest -n auto" (~5.7 min) because
# every worker re-parses the 68 MB corpus; xdist is provided for CI machines
# with cheaper startup, not as the local default.
addopts = 
    --tb=short
    --strict-markers
asyncio_mode = auto
markers =
    unit: Unit tests (fast, no external deps)
    integration: Integration tests (may use mocks)
    slow: Tests that take >5 seconds
